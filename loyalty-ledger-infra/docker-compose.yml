# Local infrastructure for developing the application (../loyalty-ledger), which applies the migrations on startup.
# Ports are published on 127.0.0.1 only. Dev passwords can be overridden via .env.
name: loyalty-ledger

services:
  postgres:
    image: postgres:18.6-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:-ledger_app}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-debezium}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./k8s/platform/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "loyalty"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      start_period: 20s
      retries: 10

  kafka-connect:
    image: quay.io/debezium/connect:3.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: loyalty-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      LEDGER_DB_HOST: postgres
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_PASSWORD:-debezium}
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/connectors"]
      interval: 10s
      start_period: 30s
      retries: 20

  # Registers the outbox connector and keeps retrying until the application applies the migrations.
  register-connector:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "/config/register-connector.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
    volumes:
      - ./k8s/app/debezium:/config:ro
    depends_on:
      kafka-connect:
        condition: service_healthy

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  kafka-data:
