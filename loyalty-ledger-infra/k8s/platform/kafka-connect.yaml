apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
spec:
  selector:
    app.kubernetes.io/name: kafka-connect
  ports:
    - name: http
      port: 8083
---
# Connectors are registered by the owner of the outbox
# (see k8s/app/register-outbox-connector-job.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.7.0.Final
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: GROUP_ID, value: "loyalty-connect" }
            - { name: CONFIG_STORAGE_TOPIC, value: "connect_configs" }
            - { name: OFFSET_STORAGE_TOPIC, value: "connect_offsets" }
            - { name: STATUS_STORAGE_TOPIC, value: "connect_statuses" }
            - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
            # Enables ${env:VAR} in connector configs, so no password goes in the connector JSON.
            - { name: CONNECT_CONFIG_PROVIDERS, value: "env" }
            - { name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS, value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider" }
            - { name: LEDGER_DB_HOST, value: "postgres.platform.svc.cluster.local" }
          envFrom:
            - secretRef:
                name: kafka-connect-credentials
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /connectors
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
