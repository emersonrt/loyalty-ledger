# The IP allowlist is enforced at the Traefik entrypoint (Terraform), before reaching this point.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loyalty-ledger
spec:
  ingressClassName: traefik
  rules:
    - host: ledger.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loyalty-ledger
                port:
                  name: http
