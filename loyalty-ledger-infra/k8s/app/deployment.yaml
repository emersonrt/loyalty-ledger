apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loyalty-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loyalty-ledger
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: loyalty-ledger
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.platform.svc.cluster.local:5432/loyalty
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka.platform.svc.cluster.local:9092
            - name: SPRING_DATA_REDIS_HOST
              value: redis.platform.svc.cluster.local
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          envFrom:
            - secretRef:
                name: ledger-db
            - secretRef:
                name: ledger-redis
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
